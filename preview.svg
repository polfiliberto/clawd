<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" shape-rendering="crispEdges">
  <style>
    .bg { fill: #000000; }
    .term-border { fill: none; stroke: #262626; stroke-width: 2; }
    .term-head { fill: #0d0d0d; }
    .txt { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; font-size: 12px; fill: #8a8a8a; }
    .acc { fill: #D97757; font-weight: bold; }
    .white { fill: #e5e5e5; font-weight: bold; }

    /* Star twinkle */
    .star1 { fill: #D97757; animation: twinkle 3s infinite ease-in-out; }
    .star2 { fill: #D97757; animation: twinkle 3s infinite ease-in-out 1.5s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.45; } }

    /* Breathing & jumping for Center Clawd (Sunglasses) */
    .clawd-main { animation: bounce 3.2s infinite steps(1); }
    @keyframes bounce {
      0%, 100% { transform: translate(328px, 108px); }
      25% { transform: translate(328px, 100px); }
      50% { transform: translate(328px, 108px); }
      65% { transform: translate(328px, 84px); }
      75% { transform: translate(328px, 108px); }
    }
    .glasses-drop { animation: gdrop 3.2s infinite steps(1); }
    @keyframes gdrop {
      0%, 15% { transform: translateY(-24px); opacity: 0; }
      20% { transform: translateY(-12px); opacity: 1; }
      25%, 100% { transform: translateY(0px); opacity: 1; }
    }
    .leg-a { animation: lega 0.6s infinite steps(1); }
    .leg-b { animation: legb 0.6s infinite steps(1); }
    @keyframes lega { 0%, 100% { height: 24px; } 50% { height: 16px; } }
    @keyframes legb { 0%, 100% { height: 16px; } 50% { height: 24px; } }

    /* Left Clawd (Classic walking) */
    .clawd-left { animation: walkLeft 4s infinite ease-in-out; }
    @keyframes walkLeft {
      0%, 100% { transform: translate(110px, 132px); }
      50% { transform: translate(146px, 132px); }
    }
    .blink { animation: blink 4s infinite steps(1); }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.25); } }

    /* Right Clawd (Sleeping Santa/Headphones zZz) */
    .clawd-right { animation: sleepBreath 2.8s infinite steps(1); }
    @keyframes sleepBreath {
      0%, 100% { transform: translate(580px, 136px); }
      50% { transform: translate(580px, 141px); }
    }
    .z1 { font-family: 'JetBrains Mono', monospace; font-weight: bold; fill: #ffffff; font-size: 14px; animation: floatZ 2.4s infinite linear; }
    .z2 { font-family: 'JetBrains Mono', monospace; font-weight: bold; fill: #D97757; font-size: 18px; animation: floatZ 2.4s infinite linear 1.2s; }
    @keyframes floatZ {
      0% { transform: translate(665px, 130px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.7; }
      100% { transform: translate(685px, 92px); opacity: 0; }
    }
  </style>

  <!-- Window Frame -->
  <rect class="bg" width="800" height="320" rx="14"/>
  <rect class="term-head" x="1" y="1" width="798" height="32" rx="13"/>
  <line x1="1" y1="33" x2="799" y2="33" stroke="#262626" stroke-width="1"/>
  <text x="18" y="21" class="txt"><tspan class="acc">&gt;_</tspan> clawd <tspan fill="#525252">--live-wallpaper</tspan></text>
  <text x="715" y="21" class="txt" fill="#525252">[ESC] menu</text>

  <!-- Pixel Stars -->
  <g class="star1">
    <rect x="70" y="70" width="4" height="4"/>
    <rect x="250" y="65" width="3" height="3"/>
    <rect x="520" y="75" width="4" height="4"/>
    <rect x="730" y="95" width="3" height="3"/>
    <rect x="210" y="240" width="4" height="4"/>
    <rect x="540" y="250" width="3" height="3"/>
  </g>
  <g class="star2">
    <rect x="160" y="85" width="3" height="3"/>
    <rect x="440" y="60" width="4" height="4"/>
    <rect x="640" y="70" width="3" height="3"/>
    <rect x="90" y="230" width="4" height="4"/>
    <rect x="390" y="255" width="3" height="3"/>
    <rect x="720" y="235" width="4" height="4"/>
  </g>

  <!-- 1. Left: Classic Clawd walking (scale p=5) -->
  <g class="clawd-left">
    <g fill="#D97C5B">
      <rect x="15" y="0" width="60" height="45"/>
      <rect x="5" y="20" width="10" height="15"/>
      <rect x="75" y="20" width="10" height="15"/>
      <rect class="leg-a" x="20" y="45" width="5" height="15"/>
      <rect class="leg-b" x="30" y="45" width="5" height="15"/>
      <rect class="leg-a" x="55" y="45" width="5" height="15"/>
      <rect class="leg-b" x="65" y="45" width="5" height="15"/>
    </g>
    <g class="blink" fill="#0B0B0B" style="transform-origin: 45px 20px;">
      <rect x="25" y="15" width="5" height="10"/>
      <rect x="60" y="15" width="5" height="10"/>
    </g>
  </g>

  <!-- 2. Center: Main Clawd with Deal-With-It Sunglasses & White Sticker Border (scale p=8) -->
  <g class="clawd-main">
    <!-- White Sticker Border -->
    <g fill="#FFFFFF">
      <rect x="16" y="-8" width="112" height="88"/>
      <rect x="0" y="24" width="144" height="40"/>
      <rect x="24" y="64" width="40" height="40"/>
      <rect x="80" y="64" width="40" height="40"/>
    </g>
    <!-- Body -->
    <g fill="#D97C5B">
      <rect x="24" y="0" width="96" height="72"/>
      <rect x="8" y="32" width="16" height="24"/>
      <rect x="120" y="32" width="16" height="24"/>
      <rect x="32" y="72" width="8" height="24"/>
      <rect x="48" y="72" width="8" height="24"/>
      <rect x="88" y="72" width="8" height="24"/>
      <rect x="104" y="72" width="8" height="24"/>
    </g>
    <!-- Base Eyes (visible while glasses drop) -->
    <g fill="#0B0B0B">
      <rect x="40" y="24" width="8" height="16"/>
      <rect x="96" y="24" width="8" height="16"/>
    </g>
    <!-- 8-bit Deal With It Sunglasses -->
    <g class="glasses-drop">
      <rect x="16" y="16" width="112" height="8" fill="#2E2E2E"/>
      <rect x="24" y="16" width="96" height="8" fill="#1C1C1C"/>
      <g fill="#0B0B0B">
        <rect x="24" y="24" width="40" height="8"/>
        <rect x="32" y="32" width="32" height="8"/>
        <rect x="32" y="40" width="24" height="8"/>
        <rect x="80" y="24" width="40" height="8"/>
        <rect x="80" y="32" width="32" height="8"/>
        <rect x="80" y="40" width="24" height="8"/>
      </g>
      <g fill="#FFFFFF">
        <rect x="32" y="24" width="8" height="8"/>
        <rect x="40" y="32" width="8" height="8"/>
        <rect x="88" y="24" width="8" height="8"/>
        <rect x="96" y="32" width="8" height="8"/>
      </g>
    </g>
  </g>

  <!-- 3. Right: Sleeping Clawd with Santa Hat (scale p=5) -->
  <g class="clawd-right">
    <!-- Body -->
    <g fill="#D97C5B">
      <rect x="15" y="0" width="60" height="45"/>
      <rect x="5" y="25" width="10" height="15"/>
      <rect x="75" y="25" width="10" height="15"/>
      <rect x="20" y="45" width="5" height="10"/>
      <rect x="30" y="45" width="5" height="10"/>
      <rect x="55" y="45" width="5" height="10"/>
      <rect x="65" y="45" width="5" height="10"/>
    </g>
    <!-- Closed Sleeping Eyes -->
    <g fill="#0B0B0B">
      <rect x="22" y="23" width="10" height="3"/>
      <rect x="58" y="23" width="10" height="3"/>
    </g>
    <!-- Scarf -->
    <rect x="15" y="35" width="60" height="5" fill="#D62828"/>
    <rect x="25" y="35" width="10" height="5" fill="#FFFFFF"/>
    <rect x="45" y="35" width="10" height="5" fill="#FFFFFF"/>
    <rect x="60" y="40" width="10" height="10" fill="#D62828"/>
    <!-- Santa Hat -->
    <rect x="10" y="-5" width="70" height="7" fill="#FFFFFF"/>
    <rect x="15" y="-15" width="55" height="10" fill="#D62828"/>
    <rect x="20" y="-25" width="45" height="10" fill="#D62828"/>
    <rect x="30" y="-30" width="35" height="5" fill="#D62828"/>
    <rect x="60" y="-25" width="15" height="10" fill="#D62828"/>
    <rect x="70" y="-20" width="12" height="12" fill="#FFFFFF"/>
  </g>
  <text class="z1">z</text>
  <text class="z2">Z</text>

  <!-- Bottom mini HUD bar -->
  <rect x="190" y="276" width="420" height="28" rx="8" fill="#0a0a0a" stroke="#262626"/>
  <text x="206" y="294" class="txt"><tspan class="acc">HUB</tspan>  <tspan class="white">Clawd</tspan> · Sunglasses · Suit · Wizard · Santa · Headphones</text>

  <rect class="term-border" x="1" y="1" width="798" height="318" rx="14"/>
</svg>
